[pytest]
testpaths = tests
markers =
    requires_cowrie: needs a real Cowrie SSH/Telnet honeypot running (layer 1)
    requires_full_stack: needs start.sh's full stack running (layer 7 E2E)
    performance: layer 8 concurrent-load test against a real Cowrie instance - slow, opt-in, run explicitly (not swept up by a bare `pytest tests/`)
