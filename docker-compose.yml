# Containerizes Mongo + parser/ + notifier/ + dashboard/. Cowrie itself is
# NOT included here (deliberate choice, see CLAUDE.md) - it keeps running
# natively via `cowrie-env/bin/cowrie start` (or start.sh), the same way it
# does today. Every container that needs the Cowrie log or the GeoIP
# database reads it from the host through a read-only bind mount instead of
# copying it into the image, so this file stays in sync with whatever the
# native Cowrie process is actually writing.
#
# First-time setup:
#   cp parser/.env.example parser/.env       # MONGO_URL/DB_NAME/DASHBOARD_ORIGIN
#   cp notifier/.env.example notifier/.env   # same, plus native-workflow secrets
#   mkdir -p parser/geoip && download GeoLite2-City.mmdb there (see SETUP.md)
#   see secrets/README.md for the 8 secret files this stack actually reads
#   its credentials from (JWT_SECRET_KEY, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID,
#   ABUSEIPDB_KEY, MONGO_USERNAME/MONGO_PASSWORD - root, admin work only -
#   and MONGO_APP_USERNAME/MONGO_APP_PASSWORD - the least-privilege user
#   every app service actually connects as) - NOT plaintext .env, see the
#   `secrets:` block below.
#
# Start Cowrie natively FIRST (or at least once, so its log file exists) -
# the log-watcher/realtime-alert containers below stat() that file at
# startup and will crash-loop (harmlessly - `restart: unless-stopped` just
# keeps retrying) until it exists.
#
# Then:
#   docker compose up -d --build
#
# API/dashboard are published to 127.0.0.1 only, matching the native
# start.sh setup's security posture (an unauthenticated port reachable from
# the same public interface as the honeypot would tell any port-scanning
# attacker this is a monitored system).
#
# Observability: mongodb-exporter + prometheus + grafana. parser-api exposes
# its own /metrics; log_watcher.py/cleanup.py/realtime_alert.py/
# daily_report.py/telegram_commands.py/backup.py/weekly_report.py/
# http_honeypot_alert.py/http_honeypot.py each expose their own /metrics too
# (prometheus_client.start_http_server(), since none of them are otherwise
# HTTP servers - ports 9100-9108, see each script's METRICS_PORT constant
# and monitoring/prometheus.yml's scrape_configs). Grafana auto-provisions
# the Prometheus datasource and a starter "Honeypot Monitor - Overview"
# dashboard from monitoring/grafana/ - open http://localhost:3000
# (admin / admin by default, change GRAFANA_ADMIN_PASSWORD before a real
# deployment).
#
# Secrets: JWT_SECRET_KEY/TELEGRAM_TOKEN/TELEGRAM_CHAT_ID/ABUSEIPDB_KEY/
# MONGO_USERNAME/MONGO_PASSWORD are delivered via Compose's native
# `secrets:` (files bind-mounted read-only at /run/secrets/<name>, kept out
# of `docker inspect`/`docker compose config` output - unlike a plain
# environment variable) rather than through env_file/.env. Each app reads
# them via a small `_read_secret()` helper (duplicated per file, see
# CLAUDE.md) that checks the "<NAME>_FILE" env var this section sets,
# falling back to the plain env var directly for the native venv workflow
# (unchanged - .env still works there exactly as before, connecting to
# mongod with no --auth). This is Compose's standalone/non-swarm secret
# support (files, not swarm's encrypted secret store) - a real step up from
# plaintext-in-.env without needing a whole extra service like Vault for a
# project this size.
#
# Mongo authentication: the mongo service bootstraps a ROOT user from
# mongo_username/mongo_password (MONGO_INITDB_ROOT_USERNAME_FILE/
# _PASSWORD_FILE - officially supported by the mongo image) on first start
# with an empty data volume - that root account is for genuine admin work
# only (backups, manual mongosh troubleshooting, mongodb-exporter's own
# clusterMonitor-level metrics access), never used by the app itself.
# mongo-init/create-app-user.sh (auto-run once, same first-start-only
# window, via the image's docker-entrypoint-initdb.d convention) creates a
# SEPARATE least-privilege user - readWrite on just the "honeypot"
# database - from mongo_app_username/mongo_app_password; every app service
# connects as THAT user via MONGO_USERNAME_FILE/MONGO_PASSWORD_FILE (see
# each file's _mongo_auth_kwargs()), so a compromised app container can't
# touch other databases or run admin commands. mongodb-exporter is the one
# exception that can't use the secrets:/_FILE mechanism (its own CLI has no
# such convention) - it reads MONGODB_USER/MONGODB_PASSWORD as plain env
# vars from secrets/mongodb_exporter.env (gitignored, plain KEY=value - not
# committed, just not file-mounted either), set to the ROOT credentials
# (not the scoped app user - mongodb-exporter's own diagnosticdata
# collector needs clusterMonitor, broader than readWrite-on-one-database).
#
# IMPORTANT: auth only takes effect on a mongo container's FIRST start with
# an empty ./data/db volume - if you already have a running stack from
# before this change, `docker compose down -v` (removes the mongo_data
# volume - THIS DELETES ALL DATA IN IT) before `up` again, or manually
# create the user on the existing database instead.

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: honeypot
      # Read by mongo-init/create-app-user.sh, NOT by mongod/the base image
      # itself - our own convention, not an officially-documented one.
      MONGO_APP_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_username
      - mongo_password
      - mongo_app_username
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/create-app-user.sh:/docker-entrypoint-initdb.d/create-app-user.sh:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      # Auth is on once bootstrapped, so a bare adminCommand('ping') isn't
      # enough to prove the credentials actually work end-to-end - this
      # authenticates with the same secret files every app service uses.
      # CMD-SHELL (not CMD) is required here: the array form of CMD execs
      # directly with no shell, so $(cat ...) command substitution would
      # never happen - it'd be passed to mongosh as a literal string.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "db.adminCommand('ping')"
          --username "$$(cat /run/secrets/mongo_username)"
          --password "$$(cat /run/secrets/mongo_password)"
          --authenticationDatabase admin
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  parser-api:
    build: ./parser
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./parser/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - jwt_secret_key
      - mongo_app_username
      - mongo_app_password
    volumes:
      # log_setup.py resolves its log directory to /logs inside this image
      # (2 levels up from /app/log_setup.py) - see CLAUDE.md if this looks
      # like a strange mount point.
      - ./logs/parser:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  parser-log-watcher:
    build: ./parser
    command: ["python", "log_watcher.py"]
    env_file: ./parser/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      COWRIE_LOG_FILE: /cowrie-log/cowrie.json
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_app_username
      - mongo_app_password
    expose: ["9100"]  # own /metrics - see log_watcher.py's METRICS_PORT
    volumes:
      - ./honeypot/cowrie-src/var/log/cowrie:/cowrie-log:ro
      - ./parser/geoip:/app/geoip:ro
      - ./logs/parser:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  parser-cleanup:
    build: ./parser
    command: ["python", "cleanup.py"]
    env_file: ./parser/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_app_username
      - mongo_app_password
    expose: ["9102"]  # own /metrics - see cleanup.py's METRICS_PORT
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  parser-http-honeypot:
    build: ./parser
    command: ["python", "http_honeypot.py"]
    env_file: ./parser/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      GEOIP_DB_PATH: /app/geoip/GeoLite2-City.mmdb
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_app_username
      - mongo_app_password
    # 8899 (the fake login page itself) is NOT published to the host here -
    # in the native start.sh workflow it's NAT'd from public port 80 (see
    # deploy/expose_webtrap_port80.sh); this container-only deployment path
    # doesn't attempt that, so it's reachable inside the Compose network
    # only unless you add your own port mapping. 9108 is its own /metrics.
    expose: ["9108"]
    volumes:
      - ./parser/geoip:/app/geoip:ro
      - ./logs/parser:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  parser-backup:
    build: ./parser
    command: ["python", "backup.py"]
    env_file: ./parser/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      BACKUP_DIR: /backups
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_app_username
      - mongo_app_password
    expose: ["9105"]  # own /metrics - see backup.py's METRICS_PORT
    volumes:
      - ./backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  notifier-realtime-alert:
    build: ./notifier
    command: ["python", "-u", "realtime_alert.py"]
    env_file: ./notifier/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      COWRIE_LOG_FILE: /cowrie-log/cowrie.json
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      ABUSEIPDB_KEY_FILE: /run/secrets/abuseipdb_key
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - telegram_token
      - telegram_chat_id
      - abuseipdb_key
      - mongo_app_username
      - mongo_app_password
    expose: ["9101"]  # own /metrics - see realtime_alert.py's METRICS_PORT
    volumes:
      - ./honeypot/cowrie-src/var/log/cowrie:/cowrie-log:ro
      - ./parser/geoip:/geoip:ro
      - ./logs/notifier:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  notifier-daily-report:
    build: ./notifier
    command: ["python", "-u", "daily_report.py"]
    env_file: ./notifier/.env
    environment:
      COWRIE_LOG_FILE: /cowrie-log/cowrie.json
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
    secrets:
      - telegram_token
      - telegram_chat_id
    expose: ["9103"]  # own /metrics - see daily_report.py's METRICS_PORT
    volumes:
      - ./honeypot/cowrie-src/var/log/cowrie:/cowrie-log:ro
      - ./logs/notifier:/logs
    restart: unless-stopped

  notifier-weekly-report:
    build: ./notifier
    command: ["python", "-u", "weekly_report.py"]
    env_file: ./notifier/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - telegram_token
      - telegram_chat_id
      - mongo_app_username
      - mongo_app_password
    expose: ["9106"]  # own /metrics - see weekly_report.py's METRICS_PORT
    volumes:
      - ./logs/notifier:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  notifier-http-honeypot-alert:
    build: ./notifier
    command: ["python", "-u", "http_honeypot_alert.py"]
    env_file: ./notifier/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - telegram_token
      - telegram_chat_id
      - mongo_app_username
      - mongo_app_password
    expose: ["9107"]  # own /metrics - see http_honeypot_alert.py's METRICS_PORT
    volumes:
      - ./logs/notifier:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  notifier-telegram-commands:
    build: ./notifier
    command: ["python", "-u", "telegram_commands.py"]
    env_file: ./notifier/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: honeypot
      MONGO_AUTH_SOURCE: honeypot
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      MONGO_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - telegram_token
      - telegram_chat_id
      - mongo_app_username
      - mongo_app_password
    expose: ["9104"]  # own /metrics - see telegram_commands.py's METRICS_PORT
    volumes:
      - ./logs/notifier:/logs
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  # --- Observability (Prometheus/Grafana) -----------------------------------
  # profiles: ["observability"] on all 3 below - a bare `docker compose up -d`
  # (no --profile flag) skips them entirely. Added after hanging a real 1
  # CPU/1GB RAM VPS: `docker compose up -d` with no service list pulled in
  # these 3 alongside mongo + the 7 parser/notifier containers, 11 containers
  # total pegged the single vCPU hard enough that even opening a new SSH
  # session timed out (see GO_LIVE.md's low-RAM note - the intent was always
  # to skip these on small boxes, this makes that the default instead of
  # something you have to remember to opt out of). Bring them up explicitly
  # with `docker compose --profile observability up -d` on a box that can
  # actually afford it (>=2GB RAM).
  mongodb-exporter:
    image: percona/mongodb_exporter:0.44
    profiles: ["observability"]
    command:
      - "--mongodb.uri=mongodb://mongo:27017"
      - "--collector.diagnosticdata"
    # mongodb_exporter's own CLI has no <NAME>_FILE convention (it's not
    # built on the docker-library base image _read_secret() elsewhere in
    # this file mimics), so its credentials come via plain MONGODB_USER/
    # MONGODB_PASSWORD env vars instead - loaded from a small, gitignored,
    # plain KEY=value file (secrets/mongodb_exporter.env), not committed,
    # just not file-mounted like the rest either. See secrets/README.md.
    env_file: ./secrets/mongodb_exporter.env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - parser-api
      - mongodb-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["observability"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Change on first login (or set GRAFANA_ADMIN_PASSWORD in your shell
      # before `docker compose up`) - this default is fine for a
      # 127.0.0.1-only dev/demo instance, not for a real public deployment.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

# Files under ./secrets/ (gitignored - see secrets/README.md for how to
# create them). Compose bind-mounts each one read-only into the containers
# that declare it under `secrets:`, at /run/secrets/<name> - this is
# Compose's standalone (non-swarm) secret support: a real file with tighter
# permissions than a plain environment variable, and absent from
# `docker inspect`/`docker compose config` output, but still just a file on
# this host's disk (not swarm's encrypted secret store) - the honest amount
# of "secret manager" achievable without adding a whole separate service
# like Vault for a project this size.
secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  telegram_token:
    file: ./secrets/telegram_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  abuseipdb_key:
    file: ./secrets/abuseipdb_key.txt
  mongo_username:
    file: ./secrets/mongo_username.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  mongo_app_username:
    file: ./secrets/mongo_app_username.txt
  mongo_app_password:
    file: ./secrets/mongo_app_password.txt
