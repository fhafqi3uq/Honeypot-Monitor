global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: honeypot-parser-api
    metrics_path: /metrics
    static_configs:
      - targets: ["parser-api:8000"]

  # log_watcher.py/cleanup.py/realtime_alert.py/daily_report.py/
  # telegram_commands.py each expose their own /metrics via
  # prometheus_client.start_http_server() - see each script's METRICS_PORT.
  - job_name: honeypot-log-watcher
    static_configs:
      - targets: ["parser-log-watcher:9100"]

  - job_name: honeypot-cleanup
    static_configs:
      - targets: ["parser-cleanup:9102"]

  - job_name: honeypot-realtime-alert
    static_configs:
      - targets: ["notifier-realtime-alert:9101"]

  - job_name: honeypot-daily-report
    static_configs:
      - targets: ["notifier-daily-report:9103"]

  - job_name: honeypot-telegram-commands
    static_configs:
      - targets: ["notifier-telegram-commands:9104"]

  - job_name: honeypot-backup
    static_configs:
      - targets: ["parser-backup:9105"]

  - job_name: honeypot-weekly-report
    static_configs:
      - targets: ["notifier-weekly-report:9106"]

  - job_name: honeypot-http-honeypot-alert
    static_configs:
      - targets: ["notifier-http-honeypot-alert:9107"]

  - job_name: honeypot-auto-block
    static_configs:
      - targets: ["notifier-auto-block:9109"]

  - job_name: honeypot-http-honeypot
    metrics_path: /metrics
    static_configs:
      - targets: ["parser-http-honeypot:9108"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
