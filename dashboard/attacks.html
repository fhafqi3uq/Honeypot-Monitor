<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tấn công — Honeypot</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <style>
    .pagination{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .page-btn{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;min-width:38px;transition:all .18s}
    .page-btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
    .page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .page-btn:disabled{opacity:0.35;cursor:not-allowed}
    .page-info{font-size:13px;color:var(--ink-muted)}
    /* Session replay modal - mirrors search.html's copy (see that file's
       own comment on why dashboard pages here don't share HTML partials). */
    .replay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
    .replay-modal-box{background:var(--surface,#12141e);border:1px solid var(--border-strong,rgba(255,255,255,.12));border-radius:var(--radius,14px);width:min(820px,92vw);padding:16px;box-shadow:var(--shadow-lg,0 20px 48px -12px rgba(0,0,0,.65))}
    .replay-modal-header{display:flex;justify-content:space-between;align-items:center;color:var(--ink,#eef1f8);margin-bottom:8px}
    .replay-close{background:none;border:none;color:var(--ink-secondary,#9aa4bd);font-size:16px;cursor:pointer}
    .replay-status{color:var(--ink-secondary,#9aa4bd);font-size:12px;margin-bottom:10px}
    .replay-term{background:#0b0d14;border-radius:var(--radius-sm,9px);padding:8px;height:360px;overflow:hidden}
    .replay-controls{display:flex;gap:12px;align-items:center;margin-top:10px;color:var(--ink-secondary,#9aa4bd);font-size:13px}
    .replay-controls button{background:var(--surface-2,#171a26);border:1px solid var(--border,rgba(255,255,255,.07));color:var(--ink,#eef1f8);border-radius:var(--radius-sm,9px);padding:6px 14px;cursor:pointer}
    .btn-replay{background:var(--blue-soft,rgba(57,135,229,.14));color:var(--blue,#3987e5);border:none;border-radius:var(--radius-sm,9px);padding:4px 10px;font-size:12px;cursor:pointer}
  </style>
</head>
<body style="visibility:hidden">
  <div class="sidebar" id="sidebar">
    <div class="logo">🍯 <span class="logo-text">Honeypot</span></div>
    <nav>
      <a href="index.html" class="nav-item">📊 <span>Dashboard</span></a>
      <a href="attacks.html" class="nav-item active">🔴 <span>Tấn công</span></a>
      <a href="stats.html" class="nav-item">📈 <span>Thống kê</span></a>
      <a href="map.html" class="nav-item">🗺️ <span>Bản đồ</span></a>
      <a href="search.html" class="nav-item">🔍 <span>Tìm kiếm IP</span></a>
      <a href="settings.html" class="nav-item">⚙️ <span>Cài đặt</span></a>
    </nav>
    <div class="status">🟢 <span>Đang giám sát</span></div>
    <button class="btn-logout" onclick="logout()">🚪 <span>Đăng xuất</span></button>
  </div>

  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

  <div class="main" id="main">
    <div class="header">
      <div>
        <h1>Danh sách tấn công</h1>
        <p id="last-updated">Cập nhật lúc: --:--:--</p>
      </div>
      <div style="display:flex;gap:8px"><button onclick="loadAttackPage()" class="btn-refresh">🔄 Làm mới</button>
      <a href="http://localhost:8000/api/export/csv" download="honeypot_attacks.csv" class="btn-refresh">📥 Export CSV</a></div>
    </div>

    <div class="card filter-bar">
      <div class="filter-row">
        <div class="filter-group">
          <label>🔍 Tìm IP</label>
          <input id="filter-ip" placeholder="Nhập địa chỉ IP..." oninput="applyFilter()"/>
        </div>
        <div class="filter-group">
          <label>📋 Loại tấn công</label>
          <select id="filter-event" onchange="applyFilter()">
            <option value="">Tất cả</option>
            <option value="cowrie.login.failed">Login Failed</option>
            <option value="cowrie.login.success">Login Success</option>
            <option value="cowrie.command.input">Command Input</option>
            <option value="cowrie.session.connect">Session Connect</option>
            <option value="cowrie.session.closed">Session Closed</option>
            <option value="cowrie.log.closed">Log Closed (có bản ghi phiên)</option>
          </select>
        </div>
        <div class="filter-group">
          <label>👤 Username</label>
          <input id="filter-user" placeholder="Tìm username..." oninput="applyFilter()"/>
        </div>
        <div class="filter-stats">
          <span id="filter-count" class="badge">0 kết quả</span>
          <button onclick="clearFilter()" class="btn-clear">✕ Xoá lọc</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Thời gian</th>
              <th>IP nguồn</th>
              <th>Quốc gia</th>
              <th>Username</th>
              <th>Password</th>
              <th>Loại</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="attack-tbody">
            <tr><td colspan="7" class="loading">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="pagination" id="pagination"></div>
      <div style="text-align:center;margin-top:8px">
        <span class="page-info" id="page-info"></span>
      </div>
    </div>
  </div>

  <!-- Modal xem lại phiên (session replay) -->
  <div id="replay-modal" class="replay-modal">
    <div class="replay-modal-box">
      <div class="replay-modal-header">
        <strong>▶ Xem lại phiên tấn công</strong>
        <button class="replay-close" onclick="closeReplayModal()">✕</button>
      </div>
      <div id="replay-status" class="replay-status">Đang tải...</div>
      <div id="replay-term" class="replay-term"></div>
      <div class="replay-controls">
        <button id="replay-playpause" onclick="toggleReplayPlayPause()">⏸</button>
        <button onclick="restartReplay()">⟲ Phát lại</button>
        <label>Tốc độ
          <select id="replay-speed" onchange="setReplaySpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <script src="js/escape.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/replay.js"></script>
  <script>
    requireAuth()
    const PAGE_SIZE  = 20
    let allAttacks   = []
    let filtered     = []
    let currentPage  = 1

    async function loadAttackPage() {
      document.getElementById('attack-tbody').innerHTML =
        '<tr><td colspan="7" class="loading">Đang tải...</td></tr>'
      const r = await authFetch(`${API_URL}/api/attacks?limit=500`)
      const d = await r.json()
      allAttacks = (d.data||[]).map(a=>({
        time:     toVnTime(a.timestamp),
        ip:       a.src_ip,
        username: a.username,
        password: a.password,
        command:  a.command,
        event:    a.event,
        country:  a.country || "Unknown",
        session:  a.session,
        ttylog:   a.ttylog
      }))
      filtered    = allAttacks
      currentPage = 1
      applyFilter()
      document.getElementById('last-updated').textContent =
        'Cập nhật lúc: ' + new Date().toLocaleTimeString('vi-VN')
    }

    function renderTable() {
      const total     = filtered.length
      const totalPage = Math.ceil(total / PAGE_SIZE)
      const start     = (currentPage - 1) * PAGE_SIZE
      const end       = Math.min(start + PAGE_SIZE, total)
      const pageData  = filtered.slice(start, end)

      document.getElementById('filter-count').textContent = `${total} kết quả`
      document.getElementById('page-info').textContent =
        `Trang ${currentPage}/${totalPage} — Hiển thị ${start+1}-${end} / ${total}`

      const tbody = document.getElementById('attack-tbody')
      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading">Không có dữ liệu</td></tr>'
      } else {
        tbody.innerHTML = pageData.map(a => {
          const { status, label } = eventStatusLabel(a.event)
          // Only cowrie.log.closed docs carry a ttylog hash (see
          // parser/parser.py) - that's the one row per SSH session a
          // "Xem lại" (replay) button can actually be attached to.
          const replayBtn = (a.event === 'cowrie.log.closed' && a.ttylog && a.session)
            ? `<button class="btn-replay" onclick="playSessionReplay('${encodeURIComponent(a.session)}')">▶ Xem lại</button>`
            : ''
          return `
            <tr>
              <td style="color:#94a3b8;font-size:12px;white-space:nowrap">${escapeHtml(a.time)||'--'}</td>
              <td style="font-family:monospace;color:#60a5fa">${escapeHtml(a.ip)||'-'}</td>
              <td style="font-size:13px">${escapeHtml(a.country)||'—'}</td>
              <td style="color:#e2e8f0">${escapeHtml(a.username)||'-'}</td>
              <td style="color:#94a3b8;font-family:monospace;font-size:12px">${escapeHtml(a.password)||'-'}</td>
              <td style="color:#64748b;font-size:12px">${escapeHtml((a.event||'').replace('cowrie.',''))}</td>
              <td><span class="badge ${status}">${label}</span> ${replayBtn}</td>
            </tr>`
        }).join('')
      }

      renderPagination(totalPage)
    }

    function renderPagination(totalPage) {
      const pg = document.getElementById('pagination')
      if (totalPage <= 1) { pg.innerHTML = ''; return }

      let html = ''

      // Nút Trước
      html += `<button class="page-btn" onclick="goPage(${currentPage-1})"
        ${currentPage===1?'disabled':''}>◀</button>`

      // Số trang
      let start = Math.max(1, currentPage - 2)
      let end   = Math.min(totalPage, start + 4)
      if (end - start < 4) start = Math.max(1, end - 4)

      if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>
        ${start > 2 ? '<span class="page-info">...</span>' : ''}`

      for (let i = start; i <= end; i++) {
        html += `<button class="page-btn ${i===currentPage?'active':''}"
          onclick="goPage(${i})">${i}</button>`
      }

      if (end < totalPage) html += `${end < totalPage-1 ? '<span class="page-info">...</span>' : ''}
        <button class="page-btn" onclick="goPage(${totalPage})">${totalPage}</button>`

      // Nút Sau
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})"
        ${currentPage===totalPage?'disabled':''}>▶</button>`

      pg.innerHTML = html
    }

    function goPage(page) {
      const totalPage = Math.ceil(filtered.length / PAGE_SIZE)
      if (page < 1 || page > totalPage) return
      currentPage = page
      renderTable()
      window.scrollTo(0, 0)
    }

    function applyFilter() {
      const ip    = document.getElementById('filter-ip').value.toLowerCase()
      const event = document.getElementById('filter-event').value
      const user  = document.getElementById('filter-user').value.toLowerCase()
      filtered    = allAttacks.filter(a => {
        const matchIP    = !ip    || (a.ip||'').toLowerCase().includes(ip)
        const matchEvent = !event || a.event === event
        const matchUser  = !user  || (a.username||'').toLowerCase().includes(user)
        return matchIP && matchEvent && matchUser
      })
      currentPage = 1
      renderTable()
    }

    function clearFilter() {
      document.getElementById('filter-ip').value    = ''
      document.getElementById('filter-event').value = ''
      document.getElementById('filter-user').value  = ''
      applyFilter()
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open')
    }

    loadAttackPage()
    setInterval(loadAttackPage, 30000)
  </script>
</body>
</html>
