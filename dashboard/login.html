<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập — Honeypot Monitor</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{align-items:center;justify-content:center}
    .login-card{
      background:var(--surface);border:1px solid var(--border);border-radius:18px;
      padding:36px 32px;width:100%;max-width:380px;margin:16px;
      box-shadow:var(--shadow-lg);
      position:relative;overflow:hidden;
    }
    .login-card::before{
      content:'';position:absolute;top:-60%;left:50%;transform:translateX(-50%);
      width:320px;height:220px;border-radius:50%;
      background:radial-gradient(circle, var(--blue-soft) 0%, transparent 70%);
      pointer-events:none;
    }
    .login-logo{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:-.01em;position:relative}
    .login-sub{font-size:13px;color:var(--ink-muted);text-align:center;margin-bottom:28px;position:relative}
    .login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;position:relative}
    .login-field label{font-size:12px;color:var(--ink-secondary);font-weight:500}
    .login-field input{background:var(--bg);border:1px solid var(--border-strong);color:var(--ink);padding:11px 13px;border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s}
    .login-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
    .btn-login{
      width:100%;background:linear-gradient(135deg,var(--blue),#2f6fc4);color:#fff;border:none;
      padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;
      transition:filter .18s,transform .18s;position:relative;margin-top:4px;
    }
    .btn-login:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .btn-login:disabled{background:var(--surface-2);filter:none;cursor:not-allowed;transform:none}
    .login-error{background:var(--critical-soft);color:#f3a3a0;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:16px;display:none;position:relative}
    .totp-input{text-align:center;font-size:20px;letter-spacing:6px}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🍯 Honeypot Monitor</div>
    <div class="login-sub" id="login-sub">Đăng nhập để xem dashboard</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required/>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn-login" id="btn-login">Đăng nhập</button>
    </form>

    <form id="totp-form" style="display:none">
      <div class="login-field">
        <label for="totp-code">Mã xác thực 2 lớp (6 số)</label>
        <input type="text" id="totp-code" class="totp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" required/>
      </div>
      <button type="submit" class="btn-login" id="btn-totp">Xác nhận</button>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script>
    const form      = document.getElementById('login-form')
    const totpForm  = document.getElementById('totp-form')
    const errorBox  = document.getElementById('login-error')
    const btn       = document.getElementById('btn-login')
    const btnTotp   = document.getElementById('btn-totp')

    function showError(message) {
      errorBox.textContent = message
      errorBox.style.display = 'block'
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorBox.style.display = 'none'
      btn.disabled = true
      btn.textContent = 'Đang đăng nhập...'

      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        })
        const data = await res.json().catch(() => ({}))
        if (res.ok && data.status === '2fa_required') {
          form.style.display = 'none'
          totpForm.style.display = 'block'
          document.getElementById('login-sub').textContent = 'Nhập mã từ app xác thực 2 lớp'
          document.getElementById('totp-code').focus()
          return
        }
        if (res.ok) {
          window.location.href = 'index.html'
          return
        }
        showError(data.detail || 'Đăng nhập thất bại. Vui lòng thử lại.')
      } catch {
        showError('Không kết nối được tới máy chủ. Vui lòng thử lại.')
      } finally {
        btn.disabled = false
        btn.textContent = 'Đăng nhập'
      }
    })

    totpForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorBox.style.display = 'none'
      btnTotp.disabled = true
      btnTotp.textContent = 'Đang xác nhận...'

      const code = document.getElementById('totp-code').value.trim()

      try {
        const res = await fetch(`${API_URL}/auth/2fa/verify`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        })
        if (res.ok) {
          window.location.href = 'index.html'
          return
        }
        const data = await res.json().catch(() => ({}))
        showError(data.detail || 'Mã không đúng. Vui lòng thử lại.')
      } catch {
        showError('Không kết nối được tới máy chủ. Vui lòng thử lại.')
      } finally {
        btnTotp.disabled = false
        btnTotp.textContent = 'Xác nhận'
      }
    })
  </script>
</body>
</html>
